{% extends 'ledger/ledger_base.html' %}
{% load static %}

{% block title %}Recipe List{% endblock %}

{% block header %}Recipe List Page{% endblock %}

{% block ledger %}
    <ul>
        {% for recipe in object_list %}
            <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'ledger:recipe-add' %}">Add Recipe</a>
{% endblock %}
