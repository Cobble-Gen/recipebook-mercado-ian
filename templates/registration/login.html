{% extends 'base.html' %}

{% block content %}
    {% if form.errors %}
        {% for field in form %}
            {{ error }}
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <a href="{%url 'password_reset' %}">Forgot Password?</a>
{% endblock %}
